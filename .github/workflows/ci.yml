name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Em pull request, um push novo cancela a execução anterior. Na main não: um deploy em
  # andamento nunca é interrompido pela metade.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Tipos, lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Testes unitários
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  audit:
    name: Dependências (npm audit)
    # Informativo: não bloqueia o deploy. As correções chegam pelos PRs do Dependabot
    # (.github/dependabot.yml); aqui fica o aviso do que ainda está em aberto na produção.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vulnerabilidades altas ou críticas nas dependências de produção
        run: |
          if ! npm audit --omit=dev --audit-level=high; then
            echo "::warning title=Dependências com vulnerabilidade::npm audit encontrou falhas altas ou críticas nas dependências de produção. Veja o log deste job e os PRs do Dependabot."
          fi

  e2e:
    name: Fluxo completo no navegador (Playwright, modo local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta
        run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Guardar o relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  firestore-rules:
    name: Regras do Firestore (emulador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache do emulador
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.31.0
      - run: npm ci
      - name: Testes das regras
        run: npm run test:rules

  deploy-firestore:
    name: Publicar regras e índices do Firestore
    # Só no push para a main (merge), depois de todos os testes passarem. Assim as regras e os
    # índices em produção são sempre os do código publicado, sem depender de deploy manual.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, firestore-rules]
    runs-on: ubuntu-latest
    env:
      # JSON da conta de serviço com os papéis "Firebase Rules Admin" e "Cloud Datastore Index Admin".
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conferir credencial
        id: credencial
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning title=Regras e índices não publicados::Cadastre o segredo FIREBASE_SERVICE_ACCOUNT no repositório (Settings > Secrets and variables > Actions) para publicar automaticamente."
            echo "disponivel=false" >> "$GITHUB_OUTPUT"
          else
            echo "disponivel=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publicar regras e índices
        if: steps.credencial.outputs.disponivel == 'true'
        # O projeto vem do .firebaserc. Índices que existem no projeto e não estão no arquivo são
        # mantidos (sem --force, nada é apagado).
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" npx --yes firebase-tools@15.31.0 deploy --only firestore:rules,firestore:indexes --non-interactive
      - name: Remover credencial
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"

  deploy-app:
    name: Publicar o app (Vercel)
    # Opcional: aciona o deploy do app só depois das regras e dos índices, para o app novo nunca
    # entrar no ar antes das regras de que depende. Só faz sentido com o deploy automático da
    # main desligado na Vercel (README > Segurança > Ordem de deploy); sem o segredo, não faz nada.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy-firestore, e2e]
    runs-on: ubuntu-latest
    env:
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - name: Acionar o deploy
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::notice title=Deploy do app não acionado pelo CI::Sem o segredo VERCEL_DEPLOY_HOOK_URL, a publicação do app segue por conta da Vercel."
          else
            curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK_URL" > /dev/null
          fi
